name: Cape Town lead finder

on:
  workflow_dispatch:
    inputs:
      source:
        description: "osm = OpenStreetMap (free, no key); google = Places API (needs GOOGLE_PLACES_API_KEY)"
        type: choice
        options: [osm, google]
        default: osm
      categories:
        description: "Comma-separated categories (blank = defaults)"
        required: false
      areas:
        description: "Comma-separated Cape Town suburbs (blank = defaults)"
        required: false
      include_social:
        description: "Also include businesses with only a social media page"
        type: boolean
        default: false
      max_requests:
        description: "Max Places API requests (google only)"
        default: "200"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find businesses without a website
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SOURCE: ${{ inputs.source }}
          CATEGORIES: ${{ inputs.categories }}
          AREAS: ${{ inputs.areas }}
          INCLUDE_SOCIAL: ${{ inputs.include_social }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          args=(--source "$SOURCE" --csv leads.csv --max-requests "$MAX_REQUESTS")
          [ -n "$CATEGORIES" ] && args+=(--categories "$CATEGORIES")
          [ -n "$AREAS" ] && args+=(--areas "$AREAS")
          [ "$INCLUDE_SOCIAL" = "true" ] && args+=(--include-social)
          python -m leadfinder "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leads-csv
          path: leads.csv
          if-no-files-found: ignore
